:"Ecuador","Effluent Management (drenaje de puntos bajos)":"Effluent Management (low-point drain)",Eficiencia:"Efficiency","El catalizador fluye fácilmente durante la descarga.":"The catalyst flows easily during unloading.","Elimina la incrustación de los tubos de la sección de convección sin necesidad de paro. Es muy amigable con el medio ambiente, no daña los tubos aletados y mejora la eficiencia del calentador.":"Removes scale from convection section tubes without a shutdown. It is very environmentally friendly, does not damage finned tubes and improves heater efficiency.","Elimina la incrustación y el ensuciamiento de los tubos de proceso en la sección radiante mediante exclusivas lanzas enfriadas por agua. Durante el servicio, el medio de limpieza orgánico se incinera completamente sin impacto ambiental. La eficiencia del calentador aumenta y las temperaturas de la superficie del tubo y de la pared intermedia disminuyen.":"Removes scale and fouling from process tubes in the radiant section using exclusive water-cooled lances. During service, the organic cleaning medium is fully incinerated with no environmental impact. Heater efficiency increases and tube skin and bridgewall temperatures decrease.","En sus primeros años, CR International ya ha completado proyectos en Sudamérica, Norteamérica, Europa, África, Asia y Oceanía, con oficinas en Houston, Concón, Auckland y Queensland.":"In its first years, CR International has already completed projects in South America, North America, Europe, Africa, Asia and Oceania, with offices in Houston, Concón, Auckland and Queensland.","En terreno":"In the field","Entrenamiento de rescate en altura":"Height rescue training","Equipo CR International en una planta con módulos rojos":"CR International team at a plant with red modules","Equipo de CR International caminando hacia la planta":"CR International team walking toward the plant","Equipo de CR International frente a la oficina en Chile":"CR International team in front of the office in Chile","Equipo de CR International operando un panel de control en planta":"CR International team operating a control panel at the plant","Equipos CR International montados en planta durante un cambio de catalizador":"CR International equipment set up at a plant during a catalyst change-out","Equipos de transferencia de masa":"Mass transfer equipment",Escribir:"Write to us","Escuchar y entender":"Listen and understand",España:"Spain","Estabiliza un tubo de proceso que se ha salido de su anclaje o soporte, sin parar la unidad ni ajustar la tasa de combustión del calentador. El HTS no devuelve el tubo a su posición original: lo estabiliza en su ubicación actual para evitar mayor migración o daños colaterales por falta de soporte.":"Stabilizes a process tube that has come off its anchor or support, without stopping the unit or adjusting the heater firing rate. HTS does not return the tube to its original position: it stabilizes it where it is to prevent further migration or collateral damage from lack of support.","Estabilización de tubos en caliente":"Hot tube stabilization","Esto se logra gracias a nuestro compromiso con la calidad, escuchando y entendiendo los desafíos y requerimientos de nuestros clientes junto con la experiencia de nuestro personal. Durante casi 40 años, hemos disfrutado enfrentándonos a los diversos y, muchas veces, inesperados desafíos que se nos presentan en la industria del petróleo y el gas.":"This is achieved through our commitment to quality, listening to and understanding our clients' challenges and requirements, together with the experience of our people. For almost 40 years, we have enjoyed tackling the diverse and often unexpected challenges that arise in the oil and gas industry.",Experiencia:"Experience","Explorar nuestros servicios":"Explore our services","Explorar servicios":"Explore services",Francia:"France","Generadores de vapor":"Steam generators","Gestión de integridad":"Integrity management",Hablemos:"Let's talk" utions.","Líneas de servicio y tecnología":"Service and technology lines","Manipulación del catalizador gastado, recuperación y activación.":"Spent catalyst handling, recovery and activation.","Marcadores fiscales (blending final)":"Fiscal markers (final blending)","Mejorar la eficiencia de la sección de convección del horno.":"Improve the efficiency of the furnace convection section.","Mejorar la eficiencia de la sección radiante del horno.":"Improve the efficiency of the furnace radiant section.","Mejores prácticas aplicadas a los procedimientos normales de parada del cliente.":"Best practices applied to the client's normal shutdown procedures.","Menor consumo de hidrógeno.":"Lower hydrogen consumption.","Menor consumo de nitrógeno.":"Lower nitrogen consumption.",Menú:"Menu","Micro detonaciones de CO₂ para material aglomerado CRDox®.":"CO₂ micro-detonations for agglomerated material, CRDox®.","Minimiza los retrasos en la manipulación de catalizadores.":"Minimizes delays in catalyst handling.",México:"Mexico","Mínimo downtime":"Minimum downtime","Mínimo tiempo de inactividad":"Minimum downtime","Nace CR International":"CR International is born","Nos adaptamos en colaboración con los requisitos de cada cliente, a menudo con soluciones únicas.":"We adapt in collaboration with each client's requirements, often with unique solutions.",Noticias:"News","Novedades, alianzas y hitos de CR International en la industria del petróleo, el gas y la petroquímica.":"News, partnerships and milestones of CR International in the oil, gas and petrochemical industry.","Nuestra Historia":"Our History","Nuestra capacidad para trabajar con seguridad en condiciones de riesgo es parte de lo que nos distingue. Cada servicio se adapta con el cliente para garantizar un tiempo de inactividad mínimo.":"Our ability to work safely in hazardous conditions is part of what sets us apart. Each service is tailored with the client to ensure minimum downtime.","Nuestra capacidad para trabajar con seguri aciones y reparaciones de reactores—, el Grupo fue adquiriendo experiencia en una gran variedad de servicios.":"Although the initial focus was on catalytic reactors —pre-commissioning services, catalyst replacement, reactor modifications and repairs— the Group gained experience in a wide variety of services.","Siguiente servicio":"Next service",Sitio:"Site","Socios & Alianzas":"Partners & Alliances","Socios Internacionales & Tecnologías":"International Partners & Technologies","Socios Locales Latam":"Local LATAM Partners","Soldadura automatizada para proporcionar integridad estructural y restaurar los límites de contención de presión.":"Automated welding to provide structural integrity and restore pressure containment boundaries.","Soluciones a la medida de cada cliente.":"Solutions tailored to each client.","Soluciones eficientes y de alta calidad que garantizan un downtime mínimo.":"Efficient, high-quality solutions that ensure minimum downtime.","Soluciones eficientes, rentables y de alta calidad":"Efficient, cost-effective, high-quality solutions","Soluciones para todos los tipos de separación, destilación y absorción en fases, líquido-líquido y extracción.":"Solutions for all types of separation, distillation and absorption in phases, liquid-liquid and extraction.","Soluciones únicas, eficientes y rentables, directamente en el campo":"Unique, efficient and cost-effective solutions, directly in the field","Suministro de DMDS / TBPS / DMDS Lite":"Supply of DMDS / TBPS / DMDS Lite",Surinam:"Suriname","TBPS (polisulfuro de di-terc-butilo) no está clasificado como material inflamable y tiene un bajo índice de toxicidad.":"TBPS (di-tert-butyl polysulfide) is not classified as a flammable material and has a low toxicity index.",Tailandia:"Thailand",Taiwán:"Taiwan",Tecnología:"Technology","Tecnología de eficiencia energética e integridad de los activos junto a IGS®, con servicios en línea sin detener la producción.":"Energy efficiency and asset integrity technology together with IGS®, with online services that do not stop production.","Tecnología de separación y servicios de torres en terreno y detenciones de planta, junto a Sulzer® ChemTech.":"Separation technology and tower services in the field and during plant turnarounds, together with Sulzer® ChemTech.","Tecnología de separación y servicios de torres en terreno y durante detenciones de planta, con consignación de hardware in situ.":"Separation technology and tower services in the field and during plant turnarounds, with on-site hardware consignment.","Tecnología y servicios de torres de destilación Sulzer":"Sulzer distillation tower technology and services",Tecnologías:"Technologies","Tecnologías asociadas":"Associated technologies","Tecnologías de marcadores especiales diseñadas para ofrecer identificación y trazabilidad precisas en sistemas industriales complejos. Concebidas para ser fiables en condiciones exigentes, respaldan el cumplimiento normativo, el aseguramiento de la calidad y el control operativo en cada etapa de la cadena de suministro.":"Special marker technologies designed to provide accurate identification and traceability in complex industrial systems. Built to be reliable under demanding conditions, they support regulatory compliance, quality assurance and operational control at every stage of the supply chain.","Tiempo de inactividad mínimo para el cliente":"Minimum downtime for the client","Tiempo reducido":"Reduced time","Todo lo que su detención de planta necesita, con un socio especialista.":"Everything your plant turnaround needs, with a specialist partner.","Torre de reactor con andamios durante trabajos de cambio de catalizador":"Reactor tower with scaffolding during catalyst change-out work",Torres:"Towers","Trabajamos junto a líderes tecnológicos de la industria.":"We work alongside the industry's technology leaders.","Trabajo seguro en condiciones de riesgo":"Safe work in hazardous conditions","Trabajos en atmósferas tóxicas y peligrosas.":"Work in toxic and hazardous atmospheres.","Tras la decisión de los nuevos propietarios de Contract Resources Group de detener inversiones en USA, Sudamérica y algunas áreas internacionales, fundamos CR International, hoy reconocida en el mercado sudamericano y en muchas otras regiones.":"Following the decision by the new owners of Contract Resources Group to halt investment in the USA, South America and some international areas, we founded CR International, today recognized in the South American market and in many other regions.",Trayectoria:"Track record",Tuberías:"Piping",Ultrasonido:"Ultrasonic","Un nuevo comienzo desde 2018, sobre casi 40 años de experiencia.":"A fresh start since 2018, built on almost 40 years of experience.","Un referente":"A benchmark","Una empresa que hoy no solo realiza servicios completos y tecnología en América del Sur, sino que también brinda servicios de carga densa, inspección especializada, decoking de hornos, gestión de detenciones / paradas mayores y soporte técnico / consultoría en otras partes del mundo.":"A company that today not only provides complete services and technology in South America, but also offers dense loading, specialized inspection, furnace decoking, turnaround / major shutdown management and technical support / consulting in other parts of the world.","Unidad móvil de decoking e inspección CR International y Cokebusters":"CR International and Cokebusters mobile decoking and inspection unit","Ver portafolio de servicios":"View service portfolio","Ver servicio →":"View service →","Ver servicios & tecnología":"View services & technology","Ver todos los servicios →":"View all services →","Verificación de limpieza":"Cleanliness verification","Vida útil remanente":"Remaining useful life","Vitalidad de los activos":"Asset vitality","Vapour-Phase®, Boil Out, Catzyme, Effluent Management y Zymeflow LNG: acceso más rápido y seguro a equipos, con menor consumo de hidrógeno y nitrógeno.":"Vapour-Phase®, Boil Out, Catzyme, Effluent Management and Zymeflow LNG: faster, safer access to equipment, with lower hydrogen and nitrogen consumption.","Zero Harm. Cuidando a las personas y al medio ambiente.":"Zero Harm. Caring for people and the environment.","Zero Harm: cuidando a las personas y al medio ambiente":"Zero Harm: caring for people and the environment",países:"countries","¿Conversamos sobre su próximo proyecto?":"Shall we talk about your next project?","¿Dónde estamos?":"Where are we?","¿Tiene un proyecto en mente?":"Have a project in mind?","Leer nota":"Read article","Volver a Noticias":"Back to News","Nota anterior":"Previous article","Nota siguiente":"Next article","Más noticias":"More news","Julio de 2018 marcó un nuevo comienzo. Los nuevos propietarios de Contract Resources Group (fundada en 1990 y que trabajó junto a nosotros hasta 2017) decidieron detener las inversiones en algunas de sus operaciones, lo que incluyó USA, Sudamérica y algunas áreas internacionales.":"July 2018 marked a fresh start. The new owners of Contract Resources Group (founded in 1990, which worked alongside us until 2017) decided to halt investment in some of its operations, including the USA, South America and some international areas.","Dado lo anterior, fundamos CR International, apoyándonos en casi 35 años de orígenes en Oriente Medio y Asia, cuando se construían nuevas refinerías y plantas petroquímicas con gran celeridad. Australia y Nueva Zelanda fueron las bases originales de lo que más tarde se convertiría en Contract Resources Group.":"Given this, we founded CR International, building on almost 35 years of origins in the Middle East and Asia, when new refineries and petrochemical plants were being built at great speed. Australia and New Zealand were the original bases of what would later become Contract Resources Group.","Desde el principio, la calidad de nuestro personal fue lo que nos distinguió, y esa realidad permanece inalterable: las personas siguen siendo nuestro activo más valioso.":"From the beginning, the quality of our people is what set us apart, and that reality remains unchanged: people remain our most valuable asset.","Hoy CR International se reconoce en el mercado sudamericano y en muchas otras regiones internacionales, con servicios completos y tecnología en Sudamérica, y carga densa, inspección especializada, decoking de hornos, gestión de paradas mayores y consultoría técnica en otras partes del mundo.":"Today CR International is recognized in the South American market and in many other international regions, with complete services and technology in South America, and dense loading, specialized inspection, furnace decoking, major turnaround management and technical consulting in other parts of the world.","Durante sus primeros 7 años, CR International ya ha completado proyectos en 20 países: EE.UU., México, Argentina, Brasil, Bolivia, Chile, Colombia, Ecuador, Perú, Uruguay, Surinam, Taiwán, Angola, Madagascar, Tailandia, Francia, España, India, Australia y Nueva Zelanda.":"During its first 7 years, CR International has already completed projects in 20 countries: USA, Mexico, Argentina, Brazil, Bolivia, Chile, Colombia, Ecuador, Peru, Uruguay, Suriname, Taiwan, Angola, Madagascar, Thailand, France, Spain, India, Australia and New Zealand.","Con oficinas en Houston USA, Concón Chile, Auckland Nueva Zelanda y Queensland Australia, brindamos total cobertura para LATAM y resto del mundo de nuestros servicios de Especialidad Oil&Gas y Petroquímicas.":"With offices in Houston USA, Concón Chile, Auckland New Zealand and Queensland Australia, we provide full coverage for LATAM and the rest of the world for our specialty Oil&Gas and Petrochemical services.","Contamos con diversas alianzas locales en cada país, de manera de facilitar las logísticas propias y de nuestros clientes.":"We have a range of local partnerships in each country, making logistics easier for us and for our clients.","Nuestra capacidad para trabajar con seguridad en condiciones de riesgo es parte de lo que nos distingue. Zero Harm resume ese compromiso: cuidar a las personas y al medio ambiente en cada proyecto.":"Our ability to work safely in hazardous conditions is part of what sets us apart. Zero Harm sums up that commitment: caring for people and the environment on every project.","Los servicios se adaptan junto a cada cliente para garantizar un tiempo de inactividad mínimo y una experiencia gratificante para todos.":"Services are tailored together with each client to ensure minimum downtime and a rewarding experience for everyone.","Este compromiso se apoya en cuatro pilares: las personas primero, seguridad, eficiencia y mínimo downtime.":"This commitment rests on four pillars: people first, safety, efficiency and minimum downtime.","Nuestro objetivo es proporcionar soluciones eficientes de alta calidad, escuchando y entendiendo los desafíos y requerimientos de nuestros clientes junto con la experiencia de nuestro personal.":"Our goal is to provide efficient, high-quality solutions, listening to and understanding our clients' challenges and requirements, together with the experience of our people.","Junto a Cokebusters® brindamos el servicio completo de decoking (pigging mecánico) de hornos y análisis de integridad por método ultrasónico.":"Together with Cokebusters® we provide the complete furnace decoking (mechanical pigging) service and ultrasonic integrity analysis.","La limpieza mecánica con pigs se aplica a calentadores de fuego directo, generadores de vapor y tuberías. La inspección en línea cubre los mismos equipos e incluye la verificación de limpieza.":"Mechanical cleaning with pigs is applied to direct-fired heaters, steam generators and piping. Online inspection covers the same equipment and includes cleanliness verification.","La gestión de integridad permite evaluar la aptitud para el servicio y la vida útil remanente de los activos.":"Integrity management makes it possible to assess the fitness for service and remaining useful life of assets.","Cokebusters® cumple 20 años de excelencia, y CR International lleva esa experiencia a Sudamérica y a otras partes del mundo.":"Cokebusters® celebrates 20 years of excellence, and CR International brings that experience to South America and other parts of the world.","Junto a Zymeflow® brindamos el servicio completo de descontaminaciones: Vapour-Phase®, Boil Out y lavado con circulación / Viscositywash.":"Together with Zymeflow® we provide the complete decontamination service: Vapour-Phase®, Boil Out and circulation wash / Viscositywash.","El método es seguro, porque permite abrir y acceder a los equipos sin necesidad de aire fresco, y rápido, con menos puntos de inyección, personal y equipos, y menor limpieza mecánica final.":"The method is safe, because it allows equipment to be opened and accessed without the need for fresh air, and fast, with fewer injection points, personnel and equipment, and less final mechanical cleaning.","Catzyme combina Hot H₂ stripping con química CatZyme (inyección química de 4 a 8 horas) y una purga de nitrógeno de tiempo reducido. Rompe los aglutinantes del coque, permite eliminar H₂S y LEL, reduce el consumo de hidrógeno y nitrógeno y hace que el catalizador fluya fácilmente durante la descarga.":"Catzyme combines Hot H₂ stripping with CatZyme chemistry (4 to 8 hours of chemical injection) and a reduced-time nitrogen purge. It breaks the coke binders, allows H₂S and LEL to be removed, reduces hydrogen and nitrogen consumption and makes the catalyst flow easily during unloading.","El portafolio se completa con Effluent Management (drenaje de puntos bajos) y Zymeflow LNG.":"The portfolio is completed by Effluent Management (low-point drain) and Zymeflow LNG.","Junto a Sulzer® ChemTech brindamos tecnología de separación y servicios de torres en terreno y durante detenciones de planta.":"Together with Sulzer® ChemTech we provide separation technology and tower services in the field and during plant turnarounds.","Ofrecemos equipos de transferencia de masa para todos los tipos de separación, destilación y absorción en fases, líquido-líquido y extracción.":"We offer mass transfer equipment for all types of separation, distillation and absorption in phases, liquid-liquid and extraction.","Realizamos servicios de instalación y upgrade de unidades claves con transferencia de masa, y consignación de hardware de torres de destilación durante TA (detenciones de planta), in situ.":"We carry out installation and upgrade services for key mass transfer units, and on-site consignment of distillation tower hardware during turnarounds (TA).","Cambio de catalizador en reactores de refinerías y plantas petroquímicas":"Catalyst change in refinery and petrochemical plant reactors","Cambio de catalizador en reactores de refinería y petroquímica junto a Nexxo: descarga y carga inerte, carga densa UOP® y Unidense®, y manejo del catalizador gastado.":"Catalyst change in refinery and petrochemical reactors together with Nexxo: inert unloading and loading, UOP® and Unidense® dense loading, and spent catalyst handling.","El cambio de catalizador consiste en descargar y cargar el catalizador de los reactores de refinerías y plantas petroquímicas. CR International lo ejecuta de forma completa junto a Nexxo, desde el pre-comisionamiento hasta el manejo del catalizador gastado.":"Catalyst change means unloading and loading the catalyst in refinery and petrochemical plant reactors. CR International carries it out end to end together with Nexxo, from pre-commissioning to spent catalyst handling.","Decoking de hornos, pigging mecánico e inspección ultrasónica en línea":"Furnace decoking, mechanical pigging and online ultrasonic inspection","Decoking (pigging mecánico) de hornos y calentadores, e inspección ultrasónica en línea para gestionar la integridad de los equipos, junto a Cokebusters®.":"Decoking (mechanical pigging) of furnaces and heaters, and online ultrasonic inspection to manage equipment integrity, together with Cokebusters®.","El decoking de hornos elimina el coque de los tubos mediante pigging mecánico. CR International lo combina con inspección ultrasónica en línea para verificar la limpieza y evaluar la aptitud para el servicio y la vida útil remanente de los equipos.":"Furnace decoking removes coke from the tubes by mechanical pigging. CR International combines it with online ultrasonic inspection to verify cleanliness and assess the fitness for service and remaining useful life of the equipment.","Descontaminaciones químicas para plantas Oil&Gas: Vapour-Phase®, Boil Out y Catzyme":"Chemical decontamination for Oil&Gas plants: Vapour-Phase®, Boil Out and Catzyme","Descontaminación química de equipos y plantas junto a Zymeflow®: Vapour-Phase®, Boil Out, Catzyme, Effluent Management y Zymeflow LNG, con acceso más rápido y seguro.":"Chemical decontamination of equipment and plants together with Zymeflow®: Vapour-Phase®, Boil Out, Catzyme, Effluent Management and Zymeflow LNG, with faster, safer access.","La descontaminación química prepara equipos y plantas para inspección, reparación y trabajos en caliente, sin necesidad de aire fresco para acceder a ellos. CR International la realiza junto a Zymeflow® con Vapour-Phase®, Boil Out y Catzyme.":"Chemical decontamination prepares equipment and plants for inspection, repair and hot work, without needing fresh air to access them. CR International performs it together with Zymeflow® using Vapour-Phase®, Boil Out and Catzyme.","Revamps y tecnología de torres de destilación: servicios en terreno y paradas de planta":"Distillation tower revamps and technology: field services and plant turnarounds","Tecnología de separación, instalación y upgrade de equipos de transferencia de masa en torres de destilación, en terreno y durante paradas de planta (TA), junto a Sulzer® ChemTech.":"Separation technology, installation and upgrade of mass transfer equipment in distillation towers, in the field and during plant turnarounds (TA), together with Sulzer® ChemTech.","Junto a Sulzer® ChemTech, CR International ofrece tecnología de separación y servicios de instalación, upgrade y consignación de hardware para torres de destilación, en terreno y durante paradas de planta (TA).":"Together with Sulzer® ChemTech, CR International offers separation technology and installation, upgrade and hardware consignment services for distillation towers, in the field and during plant turnarounds (TA).","Integridad de activos y eficiencia energética en hornos: servicios en línea sin detener la producción":"Asset integrity and energy efficiency in furnaces: online services without stopping production","Tecnología de integridad de activos y eficiencia energética para hornos y calentadores, con servicios en línea sin detener la producción, junto a IGS®.":"Asset integrity and energy efficiency technology for furnaces and heaters, with online services without stopping production, together with IGS®.","Junto a IGS®, CR International aplica tecnología y servicios en línea para proteger la integridad de hornos y recipientes a presión y mejorar su eficiencia energética, sin detener la producción.":"Together with IGS®, CR International applies technology and online services to protect the integrity of furnaces and pressure vessels and improve their energy efficiency, without stopping production.","Activación in situ de catalizadores con DMDS, aditivos para combustibles y marcadores fiscales":"In-situ catalyst activation with DMDS, fuel additives and fiscal markers","Agentes de sulfuración (DMDS / TBPS), aditivos para combustibles y marcadores fiscales para gasolina, diésel, biorrefinerías y petroquímica, junto a Chematek®.":"Sulfiding agents (DMDS / TBPS), fuel additives and fiscal markers for gasoline, diesel, biorefineries and petrochemicals, together with Chematek®.","CR International suministra agentes de sulfuración (DMDS, TBPS y DMDS Lite), realiza la activación in situ de catalizadores y provee aditivos y mar Harm de CR International":"CR International Zero Harm seal"},e1=[{q:"¿Qué es CR International?",a:"CR International es una empresa de servicios industriales y tecnología para la industria del petróleo, el gas y la petroquímica. Fue fundada en julio de 2018, cuenta con casi 40 años de experiencia en el sector y tiene oficinas en Houston (EE.UU.), Concón (Chile), Auckland (Nueva Zelanda) y Queensland (Australia)."},{q:"¿Qué servicios ofrece CR International?",a:"Seis líneas de servicio: cambio de catalizador en reactores, decoking de hornos y pigging con inspección ultrasónica, descontaminaciones químicas, revamps y tecnología de torres de destilación, integridad de activos y eficiencia energética, y activación in situ de catalizadores con DMDS, aditivos y marcadores fiscales."},{q:"¿En qué países ha realizado proyectos CR International?",a:"En 20 países: EE.UU., México, Argentina, Brasil, Bolivia, Chile, Colombia, Ecuador, Perú, Uruguay, Surinam, Taiwán, Angola, Madagascar, Tailandia, Francia, España, India, Australia y Nueva Zelanda."},{q:"¿Con qué socios tecnológicos trabaja CR International?",a:"A nivel internacional trabaja con Honeywell UOP, RST, Packgen, Sulzer, IGS, Catmasters, Zymeflow, Cokebusters y Chematek. En Latinoamérica cuenta con socios locales como Nexxo, Asuservicio, Nexxo Caribe, Proquimser, Micser y Cimsa Uruguay."},{q:"¿Cómo aborda CR International la seguridad en sus proyectos?",a:"Bajo el compromiso Zero Harm: cuidar a las personas y al medio ambiente. Cada servicio se adapta junto al cliente para garantizar un tiempo de inactividad mínimo, trabajando con seguridad en condiciones de riesgo."}],u9={"¿Qué es CR International?":"What is CR International?","CR International es una empresa de servicios industriales y tecnología para la industria del petróleo, el gas y la petroquímica. Fue fundada en julio de 2018, cuenta con casi 40 años de experiencia en el sector y tiene oficinas en Houston (EE.UU.), Concón (Chile), Auckland (Nueva Zelanda) y Queensland (Australia).":"CR International is an industrial services and technology company for the oil, gas and petrochemical industry. It was founded in July 2018, has almost 40 years of experience in the sector and has offices in Houston (USA), Concón (Chile), Auckland (New Zealand) and Queensland (Australia).","¿Qué servicios ofrece CR International?":"What services does CR International offer?","Seis líneas de servicio: cambio de catalizador en reactores, decoking de hornos y pigging con inspección ultrasónica, descontaminaciones químicas, revamps y tecnología de torres de destilación, integridad de activos y eficiencia energética, y activación in situ de catalizadores con DMDS, aditivos y marcadores fiscales.":"Six service lines: catalyst change in reactors, furnace decoking and pigging with ultrasonic inspection, chemical decontamination, distillation tower revamps and technology, asset integrity and energy efficiency, and in-situ catalyst activation with DMDS, additives and fiscal markers.","¿En qué países ha realizado proyectos CR International?":"In which countries has CR International completed projects?","En 20 países: EE.UU., México, Argentina, Brasil, Bolivia, Chile, Colombia, Ecuador, Perú, Uruguay, Surinam, Taiwán, Angola, Madagascar, Tailandia, Francia, España, India, Australia y Nueva Zelanda.":"In 20 countries: USA, Mexico, Argentina, Brazil, Bolivia, Chile, Colombia, Ecuador, Peru, Uruguay, Suriname, Taiwan, Angola, Madagascar, Thailand, France, Spain, India, Australia and New Zealand.","¿Con qué socios tecnológicos trabaja CR International?":"Which technology partners does CR International work with?","A nivel internacional trabaja con Honeywell UOP, RST, Packgen, Sulzer, IGS, Catmasters, Zymeflow, Cokebusters y Chematek. En Latinoamérica cuenta con socios locales como Nexxo, Asuservicio, Nexxo Caribe, Proquimser, Micser y Cimsa Uruguay.":"Internationally it works with Honeywell UOP, RST, Packgen, Sulzer, IGS, Catmasters, Zymeflow, Cokebusters and C do, lavado con agua y limpieza química tradicional. Mínimo número de puntos de inyección, personal y equipos, y reducción de la limpieza mecánica final."}]},{t:"h2",text:"Catzyme"},{t:"flow"},{t:"list",items:["Mejores prácticas aplicadas a los procedimientos normales de parada del cliente.","Rompe los aglutinantes del coque, permitiendo la eliminación de H₂S y LEL.","Menor consumo de hidrógeno.","Menor consumo de nitrógeno.","El catalizador fluye fácilmente durante la descarga.","Minimiza los retrasos en la manipulación de catalizadores.","Proceso predecible y controlado."]},{t:"h2",text:"Otros servicios"},{t:"list",items:["Effluent Management (drenaje de puntos bajos)","Zymeflow LNG"]},{t:"image",src:"zyme-torre.jpg",alt:"Descontaminación química en torre de proceso"}]},{slug:"revamps-destilacion",nav:"Revamps & Torres",title:"Revamps y tecnología de torres de destilación: servicios en terreno y paradas de planta",short:"Revamps y torres de destilación",card:"Tecnología de separación, instalación y upgrade de equipos de transferencia de masa en torres de destilación, en terreno y durante paradas de planta (TA), junto a Sulzer® ChemTech.",thumb:"sulzer-2.jpg",tags:["Sulzer®","Torres","TA"],blocks:[{t:"p",text:"Junto a Sulzer® ChemTech, CR International ofrece tecnología de separación y servicios de instalación, upgrade y consignación de hardware para torres de destilación, en terreno y durante paradas de planta (TA)."},{t:"partner",logo:"sulzer.png",name:"Sulzer",text:"Conjuntamente con **Sulzer® ChemTech** brindamos la tecnología de separación y los servicios de torres en terreno y detenciones de planta."},{t:"features",items:[{title:"Equipos de transferencia de masa",text:"Soluciones para todos los tipos de separación, destilación y absorción en fases, líquido-líquido y extracción."},{title:"Instalación y upgrade",text:"Servicios de instalación y upgrade de unidades claves con transferencia de masa."},{title:"Consignación de hardware",text:"Consignación de hardware de torres de destilación durante TA (detenciones de planta), in situ."}]},{t:"gallery",images:[1,2,3,4].map(e=>({src:`sulzer-${e}.jpg`,alt:"Tecnología y servicios de torres de destilación Sulzer"}))}]},{slug:"integridad-eficiencia",nav:"Integridad & Eficiencia",title:"Integridad de activos y eficiencia energética en hornos: servicios en línea sin detener la producción",short:"Integridad de activos y eficiencia energética",card:"Tecnología de integridad de activos y eficiencia energética para hornos y calentadores, con servicios en línea sin detener la producción, junto a IGS®.",thumb:"planta-andamios.jpg",tags:["IGS®","Hot-tek","Online"],blocks:[{t:"p",text:"Junto a IGS®, CR International aplica tecnología y servicios en línea para proteger la integridad de hornos y recipientes a presión y mejorar su eficiencia energética, sin detener la producción."},{t:"partner",logo:"igs.png",name:"IGS",text:"Conjuntamente con **IGS®** brindamos la tecnología de eficiencia energética e integridad de los activos."},{t:"chips",items:["Integridad","Vitalidad de los activos","Eficiencia"]},{t:"h2",text:"Tecnologías"},{t:"features",items:[{title:"HVTS",text:"Recubrimientos metálicos para detener la corrosión y erosión en recipientes a presión."},{title:"Automated Field Welding Services",text:"Soldadura automatizada para proporcionar integridad estructural y restaurar los límites de contención de presión."},{title:"Hot-tek",text:"Realice el mantenimiento esencial durante la producción normal del horno."},{title:"Tubetech",text:"Mejorar la eficiencia de la sección de convección del horno."},{title:"Cetek",text:"Mejorar la eficiencia de la sección radiante del horno."}]},{t:"h2",text:"Servicios en línea (Online Services)"},{t:"features",items:[{title:"Reparación de refractarios en caliente",text:"Se aplica a múltiples áreas dentro de un calentador en operación, sin pérdida de producción. Incluye la reparación de refractarios como refractario duro, colables e IFB (ladrillo aislante liviano)."},{title:"Limpieza de la sección de convección en caliente",text:"Elimina la incrustación de los tubos de la sección de convección sin necesidad de paro. Es muy amigable con el medio ambiente, no daña los tubos aletados y mejora la eficiencia del calentador."},{title:"Desincrustación de tubos en caliente",text:"Elimina la incrustación y el ensuciamiento de los tubos de proceso en la sección radiante mediante exclusivas lanzas enfriadas por agua. Durante el servicio, el medio de limpieza orgánico se incinera completamente sin impacto ambiental. La eficiencia del calentador aumenta y las temperaturas de la superficie del tubo y de la pared intermedia disminuyen."},{title:"Servicio de aspiración en caliente",text:"Limpia la superficie catalítica de las unidades SCR asociadas a los calentadores, sin interrumpir la producción y sin dañar el catalizador. El HVS restaura la presión diferencial a niveles óptimos, reduce el consumo eléctrico del ventilador ID y prolonga la vida útil de su motor."},{title:"Estabilización de tubos en caliente",text:"Estabiliza un tubo de proceso que se ha salido de su anclaje o soporte, sin parar la unidad ni ajustar la tasa de combustión del calentador. El HTS no devuelve el tubo a su posición original: lo estabiliza en su ubicación actual para evitar mayor migración o daños colaterales por falta de soporte."}]}]},{slug:"activacion-aditivos",nav:"Activación & Aditivos",title:"Activación in situ de catalizadores con DMDS, aditivos para combustibles y marcadores fiscales",short:"Activación in-situ, aditivos y marcadores fiscales",card:"Agentes de sulfuración (DMDS / TBPS), aditivos para combustibles y marcadores fiscales para gasolina, diésel, biorrefinerías y petroquímica, junto a Chematek®.",thumb:"chem-2.jpg",tags:["Chematek®","DMDS","Aditivos"],blocks:[{t:"p",text:"CR International suministra agentes de sulfuración (DMDS, TBPS y DMDS Lite), realiza la activación in situ de catalizadores y provee aditivos y marcadores fiscales junto a royectos en 20 países y seis continentes",text:"En sus primeros años, CR International ya ha completado proyectos en Sudamérica, Norteamérica, Europa, África, Asia y Oceanía, con oficinas en Houston, Concón, Auckland y Queensland.",image:"planta-torres.jpg",body:["Durante sus primeros 7 años, CR International ya ha completado proyectos en 20 países: EE.UU., México, Argentina, Brasil, Bolivia, Chile, Colombia, Ecuador, Perú, Uruguay, Surinam, Taiwán, Angola, Madagascar, Tailandia, Francia, España, India, Australia y Nueva Zelanda.","Con oficinas en Houston USA, Concón Chile, Auckland Nueva Zelanda y Queensland Australia, brindamos total cobertura para LATAM y resto del mundo de nuestros servicios de Especialidad Oil&Gas y Petroquímicas.","Contamos con diversas alianzas locales en cada país, de manera de facilitar las logísticas propias y de nuestros clientes.","Nuestra lista de clientes internacionales es impresionante para un “recién llegado”. ¿Cómo tan rápido? Es simple: nuestra gente y nuestros socios son los mejores."]},{slug:"zero-harm",date:"Compromiso",tag:"Seguridad",title:"Zero Harm: seguridad industrial y cuidado del medio ambiente en cada proyecto",text:"Nuestra capacidad para trabajar con seguridad en condiciones de riesgo es parte de lo que nos distingue. Cada servicio se adapta con el cliente para garantizar un tiempo de inactividad mínimo.",image:"rescate.jpg",body:["Nuestra capacidad para trabajar con seguridad en condiciones de riesgo es parte de lo que nos distingue. Zero Harm resume ese compromiso: cuidar a las personas y al medio ambiente en cada proyecto.","Los servicios se adaptan junto a cada cliente para garantizar un tiempo de inactividad mínimo y una experiencia gratificante para todos.","Este compromiso se apoya en cuatro pilares: las personas primero, seguridad, eficiencia y mínimo downtime.","Nuestro objetivo es proporcionar soluciones eficientes de alta calidad, escuchando y entendiendo los desafíos y requerimientos de nuestros clientes junto con la experiencia de nuestro personal."]},{slug:"alianza-cokebusters",date:"Alianzas",tag:"Tecnología",title:"Decoking de hornos y pigging mecánico junto a Cokebusters®",text:"Brindamos el servicio completo de decoking (pigging mecánico) de hornos y análisis de integridad por método ultrasónico, junto a Cokebusters®.",image:"decoking-camion.jpg",body:["Junto a Cokebusters® brindamos el servicio completo de decoking (pigging mecánico) de hornos y análisis de integridad por método ultrasónico.","La limpieza mecánica con pigs se aplica a calentadores de fuego directo, generadores de vapor y tuberías. La inspección en línea cubre los mismos equipos e incluye la verificación de limpieza.","La gestión de integridad permite evaluar la aptitud para el servicio y la vida útil remanente de los activos.","Cokebusters® cumple 20 años de excelencia, y CR International lleva esa experiencia a Sudamérica y a otras partes del mundo."]},{slug:"alianza-zymeflow",date:"Alianzas",tag:"Tecnología",title:"Descontaminaciones químicas con Zymeflow®: Vapour-Phase®, Boil Out y Catzyme",text:"Vapour-Phase®, Boil Out, Catzyme, Effluent Management y Zymeflow LNG: acceso más rápido y seguro a equipos, con menor consumo de hidrógeno y nitrógeno.",image:"zyme-torre.jpg",body:["Junto a Zymeflow® brindamos el servicio completo de descontaminaciones: Vapour-Phase®, Boil Out y lavado con circulación / Viscositywash.","El método es seguro, porque permite abrir y acceder a los equipos sin necesidad de aire fresco, y rápido, con menos puntos de inyección, personal y equipos, y menor limpieza mecánica final.","Catzyme combina Hot H₂ stripping con química CatZyme (inyección química de 4 a 8 horas) y una purga de nitrógeno de tiempo reducido. Rompe los aglutinantes del coque, permite eliminar H₂S y LEL, reduce el consumo de hidrógeno y nitrógeno y hace que el catalizador fluya fácilmente durante la descarga.","El portafolio se completa con Effluent Management (drenaje de puntos bajos) y Zymeflow LNG.
